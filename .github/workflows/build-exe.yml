name: build-exe

# 每次推到 main / 提 PR 都跑测试；打 v* 标签额外出包并挂到对应 Release；
# 手动触发（workflow_dispatch）只出 artifact，不发 Release。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装测试依赖
        # tests/test_web.py 会 import fastapi；TestClient 要 httpx。
        # 少装任何一个，整个测试 job 直接红。
        run: python -m pip install --disable-pip-version-check pytest fastapi uvicorn httpx

      - name: 跑测试
        env:
          PYTHONPATH: src
          PYTHONUTF8: '1'
        run: python -m pytest -q

      - name: 只读承诺自检
        # doctor 会扫源码，确认除 http.py 外没有别的地方私自联网
        env:
          PYTHONPATH: src
          PYTHONUTF8: '1'
        run: |
          python -m studydash doctor
          if ($LASTEXITCODE -ne 0) { throw "doctor 自检未通过（退出码 $LASTEXITCODE）" }

  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装打包依赖
        run: python -m pip install --disable-pip-version-check pillow pyinstaller

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建前端
        # src/studydash/web/static/ 虽然进了仓库，但 CI 里重建一次：
        # 前端编译不过要在这里红，而不是悄悄用上一版旧产物去打 exe。
        run: pwsh -File tools/build_web.ps1

      - name: 打包
        # 脚本内部用 $PSScriptRoot 定位路径，所以在哪跑都一样；
        # 它会从 src/studydash/__init__.py 读版本号、渲染版本资源，
        # 最后打印体积、SHA256 和 exe 的版本资源。
        run: pwsh -File tools/build_exe.ps1

      - name: 冒烟测试（干净目录里跑，不联网）
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Path $t -Force | Out-Null
          Copy-Item dist\studydash\* $t -Recurse -Force
          Push-Location $t
          try {
            $exe = Join-Path $t 'studydash.exe'
            if (-not (Test-Path $exe)) { throw "没找到 $exe" }

            # 1) 平台注册表：内置适配器都得在
            $pf = & $exe platforms --json | ConvertFrom-Json
            if ($pf.Count -lt 5) { throw "只装载了 $($pf.Count) 个适配器，预期 ≥5" }
            "适配器：$($pf.id -join ', ')"

            # 2) 一键渲染：demo 数据 → payload → HTML
            & $exe demo --save
            if ($LASTEXITCODE -ne 0) { throw "demo --save 退出码 $LASTEXITCODE" }
            & $exe build
            if ($LASTEXITCODE -ne 0) { throw "build 退出码 $LASTEXITCODE" }

            if (-not (Test-Path 'out\dashboard.html')) { throw '没有生成 out/dashboard.html' }
            $len = (Get-Item 'out\dashboard.html').Length
            if ($len -lt 20000) { throw "生成的 HTML 只有 $len 字节，疑似渲染失败" }
            "冒烟测试通过：out\dashboard.html $len 字节"

            # 3) 崩溃日志不该出现
            if (Test-Path 'crash.log') { throw "出现了 crash.log：`n$(Get-Content crash.log -Raw)" }

            # 4) 网页版：打包进去的前端静态资源真的能被托管
            #    只查 /（注入过令牌的 index.html）——拿不到令牌也能验，够用了。
            $proc = Start-Process -FilePath $exe -ArgumentList 'web', '--no-open', '--port', '8811' -PassThru -WindowStyle Hidden
            try {
              $ok = $false
              foreach ($i in 1..40) {
                Start-Sleep -Milliseconds 500
                try {
                  $html = (Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8811/' -TimeoutSec 3).Content
                  if ($html -match 'window\.__STUDYDASH__\s*=\s*\{') { $ok = $true; break }
                } catch { }
              }
              if (-not $ok) { throw '网页版没起来，或者 index.html 里没有注入令牌（前端产物没打进 exe？）' }
              '网页版冒烟通过：index.html 注入正常'
            } finally {
              if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            }
          } finally {
            Pop-Location
          }

      - name: 打 onedir 压缩包
        shell: pwsh
        run: |
          Compress-Archive -Path dist\studydash\* -DestinationPath dist\studydash-onedir.zip -Force
          Get-Item dist\studydash-onedir.zip | ForEach-Object { "onedir 压缩包 $([math]::Round($_.Length/1MB,2)) MB" }

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: studydash-exe
          path: |
            dist/studydash.exe
            dist/studydash-onedir.zip
          if-no-files-found: error

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: studydash ${{ github.ref_name }}
          body: |
            Windows 免安装版。**两个包选一个就行**：

            | 下载 | 体积 | 说明 |
            | --- | --- | --- |
            | `studydash.exe` | 约 9 MB | 单文件，双击即用。首次启动要解包，慢几秒 |
            | `studydash-onedir.zip` | 约 9 MB | 解压后运行里面的 `studydash.exe`。启动快，也不容易被杀软误伤 |

            双击运行时若没找到 `config.json`，会自动用内置演示数据渲染一份看板并在浏览器里打开，
            先把界面看清楚；要接真实数据再跑 `studydash init` 填 Cookie。

            > 只读工具：它只把数据读出来看，不交作业、不刷视频、不替你点任何按钮。
            > 想用命令行版：`pip install git+https://github.com/zhihang64/studydash`（尚未发布到 PyPI）。
          generate_release_notes: true
          files: |
            dist/studydash.exe
            dist/studydash-onedir.zip
          fail_on_unmatched_files: true
