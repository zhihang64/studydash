[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studydash"
description = "多平台学习进度聚合看板 · 只读，本地运行，不联网上传"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zhihang64", email = "q2748795556@163.com" }]
keywords = ["dashboard", "study", "chaoxing", "mooc", "zhihuishu", "progress", "readonly", "stat2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Office/Business",
]
# 运行时零第三方依赖：只用标准库。这是刻意的，见 README「设计取舍」。
dependencies = []

# 版本号只有一处源头：src/studydash/__init__.py 的 __version__。
# CI、exe 版本资源、README 都从那里读，避免三处手改走样。
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/zhihang64/studydash"
Repository = "https://github.com/zhihang64/studydash"
Issues = "https://github.com/zhihang64/studydash/issues"
Changelog = "https://github.com/zhihang64/studydash/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
]
# 网页版是可选能力：核心 CLI 与所有适配器只用标准库，不装这两个也能跑。
# 见 README「网页版」与 docs/web-api.md。
web = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.scripts]
studydash = "studydash.cli:main"

[project.entry-points."studydash.providers"]
# 第三方适配器可以注册进这两个同名入口点，无需改本仓库源码。
# 见 docs/plugin.md。内置适配器走包内自动发现，不在这里列。

[tool.setuptools]
package-dir = { "" = "src" }
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["studydash*"]

[tool.setuptools.package-data]
# web/static 是前端构建产物（tools\build_web.ps1 生成），必须打进 wheel，
# 否则 pip 装完 `studydash web` 会说找不到静态资源。
studydash = [
    "templates/*.html",
    "py.typed",
    "web/static/*",
    "web/static/assets/*",
]

[tool.setuptools.dynamic]
version = { attr = "studydash.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:studydash.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # 行长交给 formatter
    "B008", # 参数默认值里调用函数是 argparse 常见写法
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM", "B011"]
